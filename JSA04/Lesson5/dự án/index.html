<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game - Game Lật Thẻ</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
        }

        h2 {
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            /* margin-top: 20px; */
        }

        .card {
            width: 120px;
            height: 120px;
            background: linear-gradient(45deg, red, orange, yellow, green, blue, purple);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            border-radius: 8px;
            user-select: none;
        }

        .card.flipped {
            background: #ffffff;
            border: 2px solid #ccc;
        }

        .card.matched {
            visibility: hidden;
        }
    </style>
</head>

<body>

    <h2>Score: <span id="score">0</span></h2>

    <div class="grid" id="game-board"></div>

    <script src="script.js"></script>
</body>

</html>
