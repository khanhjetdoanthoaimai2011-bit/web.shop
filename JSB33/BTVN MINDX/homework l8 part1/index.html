<body>
    <div class="container">
        <div id="regfor">
            <h3>Register</h3>
            <form action="" id="regform">
                <!-- <label for="Username">Username.</label><br>
                <input type="text" minlength="6" name="Username" required="true" id="name" placeholder="Username" ><br> -->
                <label for="Username">Username.</label><br>
                <input type="text" name="Username" minlength="6" maxlength="18" required="true" placeholder="Username" id="Username"><br>
                <label for="email">Enter email</label><br>
                <input type="email" id="email" required="true" placeholder="Enter your email"><br>
                <label for="password">Create your password</label><br>
                <input type="password" id="password" required="true" placeholder="Password" name="password"
                    minlength="6" maxlength="18"><br>
                <label for="cpassword">Confirm your password</label><br>
                <input type="password" id="confirm_password" required pattern=""
                    oninput="this.setAttribute('pattern', document.getElementById('password').value)" name="cpassword"
                    placeholder="Confirm">
                <br><br>
                <input type="submit">
                <input type="reset"><br><br>
                <a href="http://127.0.0.1:5500/homework%20l8%20part1/index2.html">Already had an account ?</a>
            </form>
        </div>
    </div>
</body>
