    <!DOCTYPE html>
    <html>

    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <!-- <h2>Responsive Checkout Form</h2>
        <p>Resize the browser window to see the effect. When the screen is less than 800px wide, make the two columns
            stack on top of each other instead of next to each other.</p> -->
        <div class="row info">
            <div class="col-75">
                <div class="container box">
                    <form action="/action_page.php" info>

                        <div class="row info">
                            <div class="col-50">
                                <h3>Billing Address</h3>
                                <label for="fname"><i class="fa fa-user"></i> Full Name</label><br>
                                <input type="text" id="fname" name="firstname" placeholder="John M. Doe"><br>
                                <label for="email"><i class="fa fa-envelope"></i> Email</label><br>
                                <input type="text" id="email" name="email" placeholder="john@example.com"><br>
                                <label for="adr"><i class="fa fa-address-card-o"></i> Address</label><br>
                                <input type="text" id="adr" name="address" placeholder="542 W. 15th Street"><br>
                                <label for="city"><i class="fa fa-institution"></i> City</label><br>
                                <input type="text" id="city" name="city" placeholder="New York"><br>

                                <div class="row">
                                    <div class="col-50">
                                        <label for="state">State</label>
                                        <input type="text" id="state" name="state" placeholder="NY">
                                    </div>
                                    <div class="col-50">
                                        <label for="zip">Zip</label>
                                        <input type="text" id="zip" name="zip" placeholder="10001">
                                    </div>
                                </div>
                            </div>

                            <div class="col-50">
                                <h3>Payment</h3>
                                <label for="fname">Accepted Cards</label>
                                <div class="icon-container">
                                    <i class="fa fa-cc-visa" style="color:navy;"></i>
                                    <i class="fa fa-cc-amex" style="color:blue;"></i>
                                    <i class="fa fa-cc-mastercard" style="color:red;"></i>
                                    <i class="fa fa-cc-discover" style="color:orange;"></i>
                                </div>
                                <label for="cname">Name on Card</label><br>
                                <input type="text" id="cname" name="cardname" placeholder="John More Doe"><br>
                                <label for="ccnum">Credit card number</label><br>
                                <input type="text" id="ccnum" name="cardnumber" placeholder="1111-2222-3333-4444"><br>
                                <label for="expmonth">Exp Month</label><br>
                                <input type="text" id="expmonth" name="expmonth" placeholder="September"><br>
                                <div class="row">
                                    <div class="col-50">
                                        <label for="expyear">Exp Year</label>
                                        <input type="text" id="expyear" name="expyear" placeholder="2018">
                                    </div>
                                    <div class="col-50">
                                        <label for="cvv">CVV</label>
                                        <input type="text" id="cvv" name="cvv" placeholder="352">
                                    </div>
                                </div>
                            </div>

                        </div>
                        <label>
                            <input type="checkbox" checked="checked" name="sameadr"> Shipping address same as billing
                        </label>
                        <input type="submit" value="Continue to checkout" class="btn">
                    </form>
                </div>
            </div>
        </div>

    </body>

    </html>

</body>
